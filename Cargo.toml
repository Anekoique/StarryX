[workspace]
resolver = "2"
members = [
    "starry",
    "xkernel",
    "xmodules/*",
    "xcore/*",
    "crates/*",
]
exclude = [
    "apps",
    "xcore/xdisplay",
    "xcore/xdma",
    "drivers",
    "drivers/*",
    "crates/page_table_multiarch",
    "crates/page_table_multiarch/*",
    "crates/lwext4_rust",
    "crates/smoltcp",
    # vDSO source crate targets *-unknown-none with a custom linker script
    # and `dynamic-linking = true` to produce `cdylib`. Built out-of-band
    # by `make regenerate-vdso-blobs`; the resulting `.so` is committed
    # under `xkernel/src/vdso/blobs/` and embedded into the kernel via
    # `.incbin`.
    "xmodules/xvdso",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
    "Azure-stars <Azure_stars@126.com>",
    "Yuekai Jia <equation618@gmail.com>",
    "Anekoique <anekoique@gmail.com>",
]
license = "GPL-3.0-or-later OR Apache-2.0 OR MulanPSL-2.0"
homepage = "https://github.com/Anekoique/StarryX"
repository = "https://github.com/Anekoique/StarryX"
keywords = ["arceos", "kernel"]
categories = ["os", "no-std"]

[workspace.dependencies]
# ----- XCore modules (derived from ArceOS) -----------------------------------
xfeat     = { path = "xcore/xfeat", features = ["fs", "irq", "multitask", "net", "smp", "sched_rr"] }
xconfig   = { path = "xcore/xconfig" }
xdisplay  = { path = "xcore/xdisplay" }
xdriver   = { path = "xcore/xdriver" }
xdma      = { path = "xcore/xdma" }
xhal      = { path = "xcore/xhal", features = ["uspace", "rtc", "irq"] }
xlog      = { path = "xcore/xlog" }
xmm       = { path = "xcore/xmm", features = ["cow", "copy-from"] }
xnet      = { path = "xcore/xnet" }
xns       = { path = "xcore/xns", features = ["thread-local"] }
xruntime  = { path = "xcore/xruntime" }
xsync     = { path = "xcore/xsync", features = ["multitask"] }
xtask     = { path = "xcore/xtask", features = ["smp"] }
xalloc    = { path = "xcore/xalloc" }
xfs       = { path = "xcore/xfs", default-features = false, features = ["fat", "thread-local"] }

# ----- Generic crates --------------------------------------------------------
allocator             = { path = "crates/allocator" }
kernel-elf-parser      = { path = "crates/kernel_elf_parser" }
lwext4_rust            = { path = "crates/lwext4_rust", default-features = false }
page_table_entry       = { path = "crates/page_table_multiarch/page_table_entry" }
page_table_multiarch   = { path = "crates/page_table_multiarch/page_table_multiarch" }
smoltcp                = { path = "crates/smoltcp", default-features = false }
weak-map               = { path = "crates/weak-map" }

# ----- XModules --------------------------------------------------------------
xcache   = { path = "xmodules/xcache" }
xerrno   = { path = "xmodules/xerrno" }
xio      = { path = "xmodules/xio" }
xprocess = { path = "xmodules/xprocess" }
xsched   = { path = "xmodules/xsched" }
xsignal  = { path = "xmodules/xsignal" }
xuspace  = { path = "xmodules/xuspace" }
xutils   = { path = "xmodules/xutils" }
xvfs     = { path = "xmodules/xvfs" }
xvma     = { path = "xmodules/xvma" }

# ----- Driver components -----------------------------------------------------
xdriver_base        = { path = "drivers/xdriver_base" }
xdriver_block       = { path = "drivers/xdriver_block" }
xdriver_display     = { path = "drivers/xdriver_display" }
xdriver_net         = { path = "drivers/xdriver_net" }
xdriver_pci         = { path = "drivers/xdriver_pci" }
xdriver_virtio      = { path = "drivers/xdriver_virtio" }

# ----- Kernel ---------------------------------------------------------------
xkernel = { path = "xkernel" }

# ----- crates.io --------------------------------------------------------------
bitflags              = "2.6"
cfg-if                = "1.0"
crate_interface       = "0.3"
inherit-methods-macro = "0.1.0"
kernel_guard          = "0.2"
kspin                 = "0.2"
lazyinit              = "0.2"
linkme                = "0.3"
linux-raw-sys = { version = "0.12.1", default-features = false, features = [
    "no_std",
    "general",
    "net",
    "prctl",
    "system",
    "loop_device",
] }
log         = "0.4"
memory_addr = "0.4"
percpu      = "0.4"
rand        = { version = "0.10", default-features = false }
spin        = "0.10"
syscalls = { git = "https://github.com/jasonwhite/syscalls.git", rev = "92624de", default-features = false }
